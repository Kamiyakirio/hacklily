[package]
name = "hacklily-desktop"
version = "0.1.0"
description = "Hacklily sheet music editor for desktop"
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hacklily_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.11"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util", "fs", "sync", "time", "macros", "rt-multi-thread"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
base64 = "0.23"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
